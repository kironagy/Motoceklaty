<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Installment Check History (تجربة)</title>
<script src="chrome-shim.js"></script></head><body style="font-family:Tahoma">
<div style="text-align:left">مرحبا <a href="userresetpassword.aspx" id="lnkUser">Shady_Amr_auto</a></div>
<h3>Installment Check History - صفحة بتقلّد أمان</h3>
<select id="searchType"><option value="">-- اختار --</option><option value="ref">Installment Number</option><option value="nid">Customer National ID</option></select>
<input type="text" id="txtSearch"> <button type="button" id="btnSearch">بحث</button>
<div id="err" style="color:red"></div>
<div id="grid"></div>
<div id="details"></div>
<script>
  // AJAX like Aman: by national id -> a table of applications (number, user); by number -> the status
  const st = { '7': 'تمت الموافقة على الطلب', '9': 'تم رفض الطلب', '1': 'جاري الاستعلام', '3': 'العميل متوقف' };
  document.getElementById('btnSearch').onclick = () => {
    const type = document.getElementById('searchType').value, v = document.getElementById('txtSearch').value;
    document.getElementById('err').textContent = '';
    setTimeout(() => {
      if (type === 'nid') {
        const ours = '2611' + v.slice(-6, -1) + v.slice(-1);
        document.getElementById('grid').innerHTML = '<table id="gvApps" border="1"><tr><th>Installment No</th><th>User Name</th><th>Date</th></tr>'
          + '<tr><td>2500011111</td><td>Other_User</td><td>2025-01-01</td></tr>'
          + '<tr><td>' + ours + '</td><td>Shady_Amr_auto</td><td>2026-11-10</td></tr></table>';
        document.getElementById('details').innerHTML = '';
      } else if (type === 'ref') {
        document.getElementById('details').innerHTML = '<table><tr><td>Status</td><td><span class="lblStatus">' + (st[v.slice(-1)] || 'حالة غريبة') + '</span></td></tr></table>';
      } else document.getElementById('err').textContent = 'Error while rendering data';
    }, 600);
  };
</script>
<script src="fake-server.js"></script><script src="../shared.js"></script><script src="../background.js"></script>
<script src="../content.js"></script><script src="../inquiry.js"></script></body></html>
